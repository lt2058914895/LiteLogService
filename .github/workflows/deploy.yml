name: Deploy to ECS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn clean package -DskipTests -q
    
    - name: Create app directory on ECS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.ECS_HOST }}
        username: root
        key: ${{ secrets.ECS_SSH_KEY }}
        port: 22
        timeout: 60s
        use_insecure_cipher: true
        script: |
          mkdir -p /opt/app/litelog-backend
          echo "✅ Directory created successfully"
    
    - name: Copy JAR to ECS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.ECS_HOST }}
        username: root
        key: ${{ secrets.ECS_SSH_KEY }}
        port: 22
        timeout: 120s
        use_insecure_cipher: true
        source: "target/*.jar"
        target: "/opt/app/litelog-backend/"
    
    - name: Deploy to ECS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.ECS_HOST }}
        username: root
        key: ${{ secrets.ECS_SSH_KEY }}
        port: 22
        timeout: 120s
        use_insecure_cipher: true
        script: |
          # Stop existing service if running
          if pgrep -f "java.*litelog" > /dev/null; then
              echo "⏹️ Stopping existing service..."
              pkill -f "java.*litelog"
              sleep 3
              # Force kill if still running
              if pgrep -f "java.*litelog" > /dev/null; then
                  kill -9 $(pgrep -f "java.*litelog")
                  sleep 2
              fi
          fi
          
          # Navigate to app directory
          cd /opt/app/litelog-backend
          
          # Get the JAR filename
          JAR_FILE=$(ls -1 target/*.jar 2>/dev/null || ls -1 *.jar 2>/dev/null)
          
          if [ -z "$JAR_FILE" ]; then
              echo "❌ JAR file not found!"
              exit 1
          fi
          
          echo "🚀 Starting new service with: $JAR_FILE"
          
          # Start the service with proper environment
          nohup java -jar "$JAR_FILE" \
              --spring.profiles.active=prod \
              --server.port=8080 \
              > /opt/app/litelog-backend/app.log 2>&1 &
          
          # Wait for service to start
          echo "⏳ Waiting for service to start..."
          sleep 8
          
          # Verify service is running
          if pgrep -f "java.*litelog" > /dev/null; then
              echo "✅ Deployment completed successfully!"
              echo "📝 Checking service status..."
              curl -s http://localhost:8080/actuator/health 2>/dev/null || echo "Health check endpoint not available"
          else
              echo "❌ Service failed to start. Checking logs:"
              tail -30 /opt/app/litelog-backend/app.log
              exit 1
          fi