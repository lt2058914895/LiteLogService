name: Deploy to ECS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn clean package -DskipTests -q
    
    - name: Copy JAR to ECS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.ECS_HOST }}
        username: root
        password: ${{ secrets.ECS_PASSWORD }}
        port: 22
        timeout: 120s
        source: "target/*.jar"
        target: "/opt/app/litelog-backend/"
        strip_components: 1
    
    - name: Deploy to ECS via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.ECS_HOST }}
        username: root
        password: ${{ secrets.ECS_PASSWORD }}
        port: 22
        timeout: 240s
        script: |
          #!/bin/bash
          APP_DIR="/opt/app/litelog-backend"
          LOG_FILE="$APP_DIR/app.log"
          PID_FILE="$APP_DIR/app.pid"
          
          echo "=== DEPLOYMENT START ==="
          cd "$APP_DIR"
          
          # Find JAR file
          JAR_FILE=$(ls -t "$APP_DIR"/*.jar 2>/dev/null | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: JAR file not found!"
            exit 1
          fi
          echo "Found JAR: $JAR_FILE"
          
          # Stop old service by PID file
          if [ -f "$PID_FILE" ]; then
            OLD_PID=$(cat "$PID_FILE")
            if kill -0 "$OLD_PID" 2>/dev/null; then
              echo "Stopping old service (PID: $OLD_PID)..."
              kill -9 "$OLD_PID"
              sleep 3
            fi
            rm -f "$PID_FILE"
          fi
          
          # Stop any process on port 8080
          PORT_PID=$(lsof -t -i:8080 2>/dev/null)
          if [ -n "$PORT_PID" ]; then
            echo "Stopping process on port 8080 (PID: $PORT_PID)..."
            kill -9 $PORT_PID
            sleep 2
          fi
          
          # Clear old log file
          > "$LOG_FILE"
          
          # Start service
          echo "Starting service..."
          nohup java -jar "$JAR_FILE" \
            --spring.profiles.active=prod \
            --server.port=8080 \
            > "$LOG_FILE" 2>&1 &
          
          NEW_PID=$!
          echo "Started with PID: $NEW_PID"
          echo "$NEW_PID" > "$PID_FILE"
          
          # Wait for service to start
          echo "Waiting 30 seconds for service to start..."
          STARTED=false
          for i in $(seq 1 30); do
            sleep 1
            printf "."
            if lsof -i:8080 -sTCP:LISTEN 2>/dev/null | grep -q LISTEN; then
              echo ""
              echo "Port 8080 is now listening!"
              STARTED=true
              break
            fi
          done
          echo ""
          
          if [ "$STARTED" = true ]; then
            echo "=== DEPLOYMENT SUCCESS ==="
            echo "Service running on port 8080"
            echo ""
            echo "Last 20 lines of logs:"
            tail -n 20 "$LOG_FILE"
          else
            echo "=== DEPLOYMENT FAILED ==="
            echo "Full application logs:"
            cat "$LOG_FILE"
            exit 1
          fi