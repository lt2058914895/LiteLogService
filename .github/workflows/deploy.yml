name: Deploy to ECS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn clean package -DskipTests -q
    
    - name: Copy JAR to ECS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.ECS_HOST }}
        username: root
        password: ${{ secrets.ECS_PASSWORD }}
        port: 22
        timeout: 120s
        source: "target/*.jar"
        target: "/opt/app/litelog-backend/"
    
    - name: Deploy to ECS via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.ECS_HOST }}
        username: root
        password: ${{ secrets.ECS_PASSWORD }}
        port: 22
        timeout: 180s
        script: |
          # Deployment script using pure SSH
          APP_DIR="/opt/app/litelog-backend"
          LOG_FILE="$APP_DIR/app.log"
          
          echo "=== DEPLOYMENT START ==="
          
          # Create directory if not exists
          mkdir -p "$APP_DIR"
          cd "$APP_DIR"
          
          # Find JAR file
          JAR_FILE=$(ls -1 *.jar 2>/dev/null | head -1)
          
          if [ -z "$JAR_FILE" ]; then
              echo "ERROR: JAR file not found!"
              exit 1
          fi
          
          echo "Found JAR file: $JAR_FILE"
          
          # Stop existing service on port 8080
          echo "Checking for existing service..."
          PORT_PID=$(ss -tlnp | grep ':8080' | awk '{print $7}' | cut -d',' -f1 | cut -d'=' -f2 2>/dev/null)
          
          if [ ! -z "$PORT_PID" ] && [ "$PORT_PID" != "LISTEN" ] && [ "$PORT_PID" -gt 0 2>/dev/null ]; then
              echo "Stopping existing service (PID: $PORT_PID)..."
              kill -9 "$PORT_PID" 2>/dev/null || true
              sleep 3
          else
              echo "No existing service running"
          fi
          
          # Start new service
          echo "Starting service..."
          nohup java -jar "$JAR_FILE" \
              --spring.profiles.active=prod \
              --server.port=8080 \
              > "$LOG_FILE" 2>&1 &
          
          # Wait for startup
          echo "Waiting 15 seconds for service to start..."
          for i in {1..15}; do
              sleep 1
              echo -n "."
          done
          echo ""
          
          # Verify deployment
          echo "Verifying deployment..."
          if ss -tlnp | grep ':8080' | grep -q LISTEN; then
              echo ""
              echo "=== DEPLOYMENT SUCCESS ==="
              echo "Service running on port 8080"
              echo "Log file: $LOG_FILE"
          else
              echo ""
              echo "=== DEPLOYMENT FAILED ==="
              echo "Application logs:"
              tail -50 "$LOG_FILE"
              exit 1
          fi