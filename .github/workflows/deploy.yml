name: Deploy to ECS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn clean package -DskipTests -q
    
    - name: Copy JAR to ECS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.ECS_HOST }}
        username: root
        key: ${{ secrets.ECS_SSH_KEY }}
        port: 22
        source: "target/*.jar"
        target: "/opt/app/litelog-backend/"
    
    - name: Deploy to ECS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.ECS_HOST }}
        username: root
        key: ${{ secrets.ECS_SSH_KEY }}
        port: 22
        script: |
          # 创建应用目录（确保存在）
          mkdir -p /opt/app/litelog-backend
          
          # 停止旧服务（如果运行中）
          if pgrep -f "java.*litelog" > /dev/null; then
              echo "Stopping existing service..."
              pkill -f "java.*litelog"
              sleep 3
          fi
          
          # 启动新服务
          echo "Starting new service..."
          cd /opt/app/litelog-backend
          nohup java -jar *.jar > app.log 2>&1 &
          
          # 等待服务启动
          sleep 5
          
          # 验证服务是否启动成功
          if pgrep -f "java.*litelog" > /dev/null; then
              echo "✅ Deployment completed successfully!"
          else
              echo "❌ Service failed to start. Check logs:"
              tail -20 /opt/app/litelog-backend/app.log
              exit 1
          fi