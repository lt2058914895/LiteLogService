name: Deploy to ECS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn clean package -DskipTests -q
    
    - name: Copy JAR to ECS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.ECS_HOST }}
        username: root
        password: ${{ secrets.ECS_PASSWORD }}
        port: 22
        timeout: 120s
        source: "target/*.jar"
        target: "/opt/app/litelog-backend/"
    
    - name: Deploy to ECS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.ECS_HOST }}
        username: root
        password: ${{ secrets.ECS_PASSWORD }}
        port: 22
        timeout: 180s
        script: |
          echo "=== DEPLOYMENT START ==="
          
          mkdir -p /opt/app/litelog-backend
          
          LITELOG_PID=$(pgrep -f "java.*litelog.*\.jar" 2>/dev/null)
          
          if [ ! -z "$LITELOG_PID" ]; then
              echo "Stopping litelog service (PID: $LITELOG_PID)..."
              kill $LITELOG_PID 2>/dev/null
              sleep 3
              LITELOG_PID=$(pgrep -f "java.*litelog.*\.jar" 2>/dev/null)
              if [ ! -z "$LITELOG_PID" ]; then
                  kill -9 $LITELOG_PID 2>/dev/null
                  sleep 2
              fi
              echo "Service stopped"
          else
              echo "No litelog service running"
          fi
          
          cd /opt/app/litelog-backend
          echo ""
          echo "Files:"
          ls -la *.jar 2>/dev/null || echo "No JAR files"
          
          JAR_FILE=$(ls -1 *.jar 2>/dev/null | head -1)
          
          if [ -z "$JAR_FILE" ]; then
              echo "ERROR: JAR file not found!"
              exit 1
          fi
          
          echo ""
          echo "Starting: $JAR_FILE"
          
          nohup java -jar "$JAR_FILE" \
              --spring.profiles.active=prod \
              --server.port=8080 \
              > /opt/app/litelog-backend/app.log 2>&1 &
          
          sleep 12
          
          LITELOG_PID=$(pgrep -f "java.*$JAR_FILE" 2>/dev/null)
          
          if [ ! -z "$LITELOG_PID" ]; then
              echo ""
              echo "=== DEPLOYMENT SUCCESS ==="
              echo "PID: $LITELOG_PID"
          else
              echo ""
              echo "=== DEPLOYMENT FAILED ==="
              tail -30 /opt/app/litelog-backend/app.log
              exit 1
          fi
