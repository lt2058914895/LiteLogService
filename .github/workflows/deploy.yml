name: Deploy to ECS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn clean package -DskipTests -q
    
    - name: List built files (debug)
      run: ls -la target/*.jar
    
    - name: Create app directory on ECS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.ECS_HOST }}
        username: root
        password: ${{ secrets.ECS_PASSWORD }}
        port: 22
        timeout: 60s
        script: |
          mkdir -p /opt/app/litelog-backend
          echo "Created directory /opt/app/litelog-backend"
    
    - name: Copy JAR to ECS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.ECS_HOST }}
        username: root
        password: ${{ secrets.ECS_PASSWORD }}
        port: 22
        timeout: 120s
        source: "target/*.jar"
        target: "/opt/app/litelog-backend/"
    
    - name: Deploy to ECS via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.ECS_HOST }}
        username: root
        password: ${{ secrets.ECS_PASSWORD }}
        port: 22
        timeout: 180s
        script: |
          APP_DIR="/opt/app/litelog-backend"
          LOG_FILE="$APP_DIR/app.log"
          
          echo "=== DEPLOYMENT START ==="
          
          cd "$APP_DIR"
          
          echo "Listing files in $APP_DIR:"
          ls -la
          
          JAR_FILE=$(find . -name "*.jar" -type f 2>/dev/null | head -1)
          
          if [ -z "$JAR_FILE" ]; then
              echo "ERROR: JAR file not found!"
              exit 1
          fi
          
          echo "Found JAR: $JAR_FILE"
          
          PORT_PID=$(ss -tlnp | grep ':8080' | awk '{print $7}' | cut -d',' -f1 | cut -d'=' -f2 2>/dev/null)
          if [ ! -z "$PORT_PID" ] && [ "$PORT_PID" != "LISTEN" ] && [ "$PORT_PID" -gt 0 2>/dev/null ]; then
              echo "Stopping existing service (PID: $PORT_PID)..."
              kill -9 "$PORT_PID" 2>/dev/null || true
              sleep 3
          fi
          
          echo "Starting service..."
          nohup java -jar "$JAR_FILE" --spring.profiles.active=prod --server.port=8080 > "$LOG_FILE" 2>&1 &
          
          sleep 15
          
          if ss -tlnp | grep ':8080' | grep -q LISTEN; then
              echo "=== DEPLOYMENT SUCCESS ==="
          else
              echo "=== DEPLOYMENT FAILED ==="
              tail -50 "$LOG_FILE"
              exit 1
          fi
