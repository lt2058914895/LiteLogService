name: Deploy to ECS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn clean package -DskipTests -q
    
    - name: Copy JAR to ECS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.ECS_HOST }}
        username: root
        password: ${{ secrets.ECS_PASSWORD }}
        port: 22
        timeout: 120s
        source: "target/*.jar"
        target: "/opt/app/litelog-backend/"
    
    - name: Deploy to ECS via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.ECS_HOST }}
        username: root
        password: ${{ secrets.ECS_PASSWORD }}
        port: 22
        timeout: 240s
        script: |
          APP_DIR="/opt/app/litelog-backend"
          LOG_FILE="$APP_DIR/app.log"
          
          echo "=== DEPLOYMENT START ==="
          
          cd "$APP_DIR"
          
          # Find JAR file
          JAR_FILE=$(find . -name "*.jar" -type f 2>/dev/null | head -1)
          
          if [ -z "$JAR_FILE" ]; then
              echo "ERROR: JAR file not found!"
              exit 1
          fi
          
          echo "Found JAR: $JAR_FILE"
          
          # Stop service using PID file if exists
          if [ -f "$APP_DIR/app.pid" ]; then
              OLD_PID=$(cat "$APP_DIR/app.pid")
              if ps -p "$OLD_PID" > /dev/null 2>&1; then
                  echo "Stopping old service (PID: $OLD_PID)..."
                  kill "$OLD_PID" 2>/dev/null || true
                  sleep 3
              fi
          fi
          
          # Stop any process on port 8080 using fuser
          if command -v fuser > /dev/null; then
              fuser -k 8080/tcp 2>/dev/null || true
              sleep 2
          fi
          
          # Clear old logs
          > "$LOG_FILE"
          
          # Start service
          echo "Starting service..."
          nohup java -jar "$JAR_FILE" --spring.profiles.active=prod --server.port=8080 > "$LOG_FILE" 2>&1 &
          
          # Save PID
          NEW_PID=$!
          echo "$NEW_PID" > "$APP_DIR/app.pid"
          echo "Started with PID: $NEW_PID"
          
          # Wait for startup
          echo "Waiting 30 seconds for service to start..."
          for i in {1..30}; do
              sleep 1
              echo -n "."
              if ss -tlnp | grep ':8080' | grep -q LISTEN; then
                  echo ""
                  echo "✅ Port 8080 is now listening!"
                  break
              fi
          done
          echo ""
          
          # Final check
          echo "Checking service status..."
          if ss -tlnp | grep ':8080' | grep -q LISTEN; then
              echo "=== DEPLOYMENT SUCCESS ==="
              echo "Service running on port 8080"
              echo ""
              echo "📝 Last 20 lines of logs:"
              tail -20 "$LOG_FILE"
          else
              echo "=== DEPLOYMENT FAILED ==="
              echo "📝 Full application logs:"
              tail -100 "$LOG_FILE"
              exit 1
          fi