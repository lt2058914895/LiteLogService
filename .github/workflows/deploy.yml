name: Deploy to ECS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn clean package -DskipTests -q
    
    - name: Install Alibaba Cloud CLI
      run: |
        curl -sSL https://raw.githubusercontent.com/aliyun/aliyun-cli/master/install.sh | bash
        aliyun configure set --profile default --region cn-hangzhou
    
    - name: Deploy to ECS using Alibaba Cloud CLI
      env:
        ALIBABA_ACCESS_KEY: ${{ secrets.ALIBABA_ACCESS_KEY }}
        ALIBABA_SECRET_KEY: ${{ secrets.ALIBABA_SECRET_KEY }}
        ECS_INSTANCE_ID: ${{ secrets.ECS_INSTANCE_ID }}
      run: |
        # Configure Alibaba Cloud CLI
        aliyun configure set \
          --access-key-id "$ALIBABA_ACCESS_KEY" \
          --access-key-secret "$ALIBABA_SECRET_KEY" \
          --region cn-hangzhou \
          --language zh
    
        # Copy JAR to ECS using SCP
        aliyun ecs RunCommand \
          --RegionId cn-hangzhou \
          --InstanceId "$ECS_INSTANCE_ID" \
          --CommandType RunShellScript \
          --CommandContent "mkdir -p /opt/app/litelog-backend"
        
        # Use scp to copy file
        scp -o StrictHostKeyChecking=no \
          target/*.jar \
          root@${{ secrets.ECS_HOST }}:/opt/app/litelog-backend/
        
        # Execute deployment script on ECS
        aliyun ecs RunCommand \
          --RegionId cn-hangzhou \
          --InstanceId "$ECS_INSTANCE_ID" \
          --CommandType RunShellScript \
          --CommandContent "
            APP_DIR='/opt/app/litelog-backend'
            cd \"$APP_DIR\"
            
            JAR_FILE=\$(ls -1 *.jar 2>/dev/null | head -1)
            
            if [ -z \"\$JAR_FILE\" ]; then
                echo 'ERROR: JAR file not found!'
                exit 1
            fi
            
            echo \"Found JAR: \$JAR_FILE\"
            
            # Kill process on port 8080
            PORT_PID=\$(lsof -ti:8080 2>/dev/null)
            if [ ! -z \"\$PORT_PID\" ]; then
                kill -9 \"\$PORT_PID\" 2>/dev/null || true
                sleep 2
            fi
            
            # Start service
            nohup java -jar \"\$JAR_FILE\" --spring.profiles.active=prod --server.port=8080 > app.log 2>&1 &
            
            sleep 15
            
            if lsof -Pi:8080 -sTCP:LISTEN > /dev/null; then
                echo 'DEPLOYMENT SUCCESS'
            else
                echo 'DEPLOYMENT FAILED'
                tail -30 app.log
                exit 1
            fi
          "
