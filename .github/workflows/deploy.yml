name: Deploy to ECS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn clean package -DskipTests -q
    
    - name: Copy JAR to ECS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.ECS_HOST }}
        username: root
        password: ${{ secrets.ECS_PASSWORD }}
        port: 22
        timeout: 120s
        source: "target/*.jar"
        target: "/opt/app/litelog-backend/"
    
    - name: Deploy to ECS via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.ECS_HOST }}
        username: root
        password: ${{ secrets.ECS_PASSWORD }}
        port: 22
        timeout: 240s
        script: |
          powershell -Command "
            \$APP_DIR = '/opt/app/litelog-backend'
            \$LOG_FILE = Join-Path \$APP_DIR 'app.log'
            \$PID_FILE = Join-Path \$APP_DIR 'app.pid'
            
            Write-Host '=== DEPLOYMENT START ==='
            
            Set-Location \$APP_DIR
            
            \$jarFiles = Get-ChildItem -Path \$APP_DIR -Filter '*.jar' -File
            if (-not \$jarFiles) {
                Write-Host 'ERROR: JAR file not found!'
                exit 1
            }
            \$JAR_FILE = \$jarFiles[0].FullName
            Write-Host \"Found JAR: \$JAR_FILE\"
            
            if (Test-Path \$PID_FILE) {
                \$OLD_PID = Get-Content \$PID_FILE -Raw
                \$oldProcess = Get-Process -Id \$OLD_PID -ErrorAction SilentlyContinue
                if (\$oldProcess) {
                    Write-Host \"Stopping old service (PID: \$OLD_PID)...\"
                    \$oldProcess | Stop-Process -Force
                    Start-Sleep -Seconds 3
                }
            }
            
            \$portProcesses = Get-NetTCPConnection -LocalPort 8080 -ErrorAction SilentlyContinue | Select-Object -ExpandProperty OwningProcess -Unique
            foreach (\$pid in \$portProcesses) {
                \$proc = Get-Process -Id \$pid -ErrorAction SilentlyContinue
                if (\$proc) {
                    Write-Host \"Stopping process on port 8080 (PID: \$pid)...\"
                    \$proc | Stop-Process -Force
                    Start-Sleep -Seconds 2
                }
            }
            
            if (Test-Path \$LOG_FILE) {
                Clear-Content \$LOG_FILE
            }
            
            Write-Host 'Starting service...'
            \$javaPath = (Get-Command java -ErrorAction SilentlyContinue).Source
            if (-not \$javaPath) {
                \$javaPath = 'java'
            }
            
            \$startInfo = New-Object System.Diagnostics.ProcessStartInfo
            \$startInfo.FileName = \$javaPath
            \$startInfo.Arguments = \"-jar `"\$JAR_FILE`" --spring.profiles.active=prod --server.port=8080\"
            \$startInfo.WorkingDirectory = \$APP_DIR
            \$startInfo.RedirectStandardOutput = \$true
            \$startInfo.RedirectStandardError = \$true
            \$startInfo.UseShellExecute = \$false
            \$startInfo.CreateNoWindow = \$true
            
            \$process = New-Object System.Diagnostics.Process
            \$process.StartInfo = \$startInfo
            \$process.Start() | Out-Null
            
            \$NEW_PID = \$process.Id
            Write-Host \"Started with PID: \$NEW_PID\"
            \$NEW_PID | Set-Content \$PID_FILE
            
            Write-Host 'Waiting 30 seconds for service to start...'
            \$started = \$false
            for (\$i = 1; \$i -le 30; \$i++) {
                Start-Sleep -Seconds 1
                Write-Host -NoNewline '.'
                \$listener = Get-NetTCPConnection -LocalPort 8080 -State Listen -ErrorAction SilentlyContinue
                if (\$listener) {
                    Write-Host ''
                    Write-Host '✅ Port 8080 is now listening!'
                    \$started = \$true
                    break
                }
            }
            Write-Host ''
            
            if (\$started) {
                Write-Host '=== DEPLOYMENT SUCCESS ==='
                Write-Host 'Service running on port 8080'
                Write-Host ''
                Write-Host '📝 Last 20 lines of logs:'
                if (Test-Path \$LOG_FILE) {
                    Get-Content \$LOG_FILE | Select-Object -Last 20
                }
            } else {
                Write-Host '=== DEPLOYMENT FAILED ==='
                Write-Host '📝 Full application logs:'
                if (Test-Path \$LOG_FILE) {
                    Get-Content \$LOG_FILE
                }
                exit 1
            }
          "
